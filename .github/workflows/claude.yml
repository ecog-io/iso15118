name: Claude Code

# On-demand Claude, triggered by @claude in a PR comment, review, review thread or
# issue: `@claude fix` on a review finding pushes the fix to the PR branch, and any
# other `@claude <request>` answers or makes the change asked for (DEVOPS-373).
#
# `@claude review` is NOT handled here: claude-review.yml owns it (the incremental
# re-review), so a PR comment containing it is skipped below and never answered twice.
#
# Bots are skipped: claude[bot]'s own review comments mention `@claude fix`.
#
# AUTH: Vertex AI via Workload Identity Federation, using the org variables, the
# same path as claude-review.yml.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && !endsWith(github.actor, '[bot]')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write        # pushes fixes to the PR branch
      pull-requests: write   # posts its answer as a comment
      issues: write          # same, for issue threads
      id-token: write        # required for OIDC to Google Cloud
      actions: read          # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_VERTEX_SERVICE_ACCOUNT }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc  # v1.0.276
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION }}
        with:
          use_vertex: "true"
          # No claude.ai "Fix this →" links: fixes go through `@claude fix`.
          include_fix_links: "false"
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.VERTEX_CLAUDE_MODEL }}
            --append-system-prompt "Keep GitHub replies short: the answer or the change you made, in a few lines. No headings, no task checklist, no recap of what you read. When asked to fix a review finding, change only what that finding asks for; leave other findings alone unless they are named."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh run view:*)"
